<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FMP 基本面分析</title>
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --text: #1b1f24; --muted: #5f6b7a; --border: #dde2e8;
  --accent: #2563eb; --neg: #b91c1c; --warn-bg: #fff7e6; --warn-text: #8a5a00; --row: #f1f4f8;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0f1216; --card: #181c22; --text: #e6e9ee; --muted: #98a2b0; --border: #2a313a;
    --accent: #6ea0ff; --neg: #f87171; --warn-bg: #2b2210; --warn-text: #f5c56b; --row: #1f252d; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 20px 16px 48px; }
h1 { font-size: 20px; margin: 0 0 14px; }
form { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; background: var(--card);
  border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
label { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); gap: 4px; }
input, select { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border);
  border-radius: 6px; padding: 7px 9px; min-width: 0; }
#symbol { width: 120px; text-transform: uppercase; font-weight: 600; }
.small { width: 90px; }
#peers { width: 180px; }
button { font: inherit; background: var(--accent); color: #fff; border: 0; border-radius: 6px;
  padding: 8px 18px; cursor: pointer; font-weight: 600; }
button:disabled { opacity: .6; cursor: wait; }
.chk { flex-direction: row; align-items: center; gap: 6px; padding-bottom: 8px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-top: 14px;
  overflow-wrap: anywhere; }
.notice { background: var(--warn-bg); color: var(--warn-text); border-radius: 8px; padding: 10px 12px; margin-top: 14px;
  font-size: 13px; overflow-wrap: anywhere; }
.error { color: var(--neg); white-space: pre-wrap; }
.head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: baseline; }
.name { font-size: 22px; font-weight: 700; }
.sub { color: var(--muted); font-size: 13px; }
.price { font-size: 26px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.pmeta { text-align: right; }
/* eight tiles: four a row, two on a phone */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
.stat { background: var(--row); border-radius: 8px; padding: 10px; }
.stat .k, .stat .n { font-size: 12px; color: var(--muted); }
.stat .v { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
/* the report's own header lines (sector line, data basis, company type), under the tiles */
.rhead { margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 13px; color: var(--muted); }
.rhead p { margin: 2px 0; }
.rhead b { color: var(--text); }
@media (max-width: 760px) { .price, .pmeta { text-align: left; } }
@media (max-width: 640px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
h3 { margin: 0 0 8px; font-size: 15px; }
.section h3 { margin-top: 18px; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.tab { background: var(--card); color: var(--text); border: 1px solid var(--border); font-weight: 500; padding: 6px 12px; }
.tab.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.section { overflow-x: auto; overflow-wrap: normal; }
.section a { color: var(--accent); }
.section h2 { font-size: 16px; margin: 0 0 10px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; margin: 8px 0 14px; font-variant-numeric: tabular-nums; }
th, td { border-bottom: 1px solid var(--border); padding: 6px 8px; text-align: right; white-space: nowrap; }
th:first-child, td:first-child, th.l, td.l { text-align: left; }
th { color: var(--muted); font-weight: 600; background: var(--row); }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 0 0 14px; }
.top h1 { margin: 0; }
button.lang { background: var(--card); color: var(--text); border: 1px solid var(--border); font-weight: 500;
  padding: 5px 12px; }
.spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--muted); border-top-color: transparent;
  border-radius: 50%; animation: s 0.8s linear infinite; vertical-align: -2px; margin-right: 6px; }
@keyframes s { to { transform: rotate(360deg); } }
details { margin-top: 10px; } summary { cursor: pointer; color: var(--muted); }
pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; margin: 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1 data-i18n="title">FMP 基本面分析</h1>
    <button type="button" class="lang" id="lang"></button>
  </div>
  <form id="f">
    <label><span data-i18n="f_symbol"></span><input id="symbol" name="symbol" placeholder="AAPL" required autofocus></label>
    <label><span data-i18n="f_peers"></span><input id="peers" name="peers" data-i18n-ph="ph_peers"></label>
    <label><span data-i18n="f_discount"></span><input class="small" name="discount" data-i18n-ph="ph_auto" data-i18n-title="discount_tip"></label>
    <label><span data-i18n="f_growth"></span><input class="small" name="growth" data-i18n-ph="ph_auto"></label>
    <label><span data-i18n="f_terminal"></span><input class="small" name="terminal" placeholder="2.5"></label>
    <label><span data-i18n="f_fcf"></span><select name="fcf_base"><option value="latest" data-i18n="opt_latest"></option><option value="avg3" data-i18n="opt_avg3"></option></select></label>
    <label class="chk"><input type="checkbox" name="macro" value="1"><span data-i18n="c_macro"></span></label>
    <label class="chk"><input type="checkbox" name="refresh" value="1"><span data-i18n="c_refresh"></span></label>
    <button id="go" data-i18n="go"></button>
  </form>
  <div id="out"></div>
</div>
<script src="i18n.js"></script>
<script>
// The page shows one fa-2.0 document (facts only) and its report, as /api/analyze answers them:
// {"result": the fa-2.0 document, "report": the markdown of scripts/facts_report.py, "log": stderr}.
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// Number formats of the report (scripts/facts_report.py), so the tiles read like its tables.
const pct = v => v == null ? "n/a" : Math.abs(v) < 0.0005 ? "0.0%" : (v * 100).toFixed(1) + "%";
const mult = v => v == null ? "n/a" : Math.abs(v) < 0.05 ? "0.0x" : v.toFixed(1) + "x";
function money(v) {
  if (v == null) return "n/a";
  const a = Math.abs(v), s = v < 0 ? "-" : "";
  for (const [d, x] of [[1e12, "T"], [1e9, "B"], [1e6, "M"], [1e3, "K"]]) if (a >= d) return s + (a / d).toFixed(2) + x;
  return s + a.toFixed(0);
}
function perShare(v) {
  if (v == null) return "n/a";
  const [i, f] = Math.abs(v).toFixed(2).split(".");
  return (v < 0 ? "-" : "") + i.replace(/\B(?=(\d{3})+$)/g, ",") + "." + f;
}
const last = a => Array.isArray(a) && a.length ? a[a.length - 1] : null;

// Language: "zh" (default) shows the page and the report in Chinese; "en" shows the original English report.
let LANG = "zh";
try { if (localStorage.getItem("lang") === "en") LANG = "en"; } catch (e) {}
const t = (key, ...a) => { const v = UI[LANG][key]; return typeof v === "function" ? v(...a) : (v ?? key); };
const tr = s => LANG === "zh" ? zh(s) : String(s ?? "");
let lastData = null, lastSymbol = "", curTab = 0;

function applyLang() {
  document.documentElement.lang = LANG === "zh" ? "zh-CN" : "en";
  document.title = t("title");
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-ph]").forEach(el => el.placeholder = t(el.dataset.i18nPh));
  document.querySelectorAll("[data-i18n-title]").forEach(el => el.title = t(el.dataset.i18nTitle));
  $("#lang").textContent = t("lang_button");
  $("#lang").title = t("lang_hint");
}
$("#lang").onclick = () => {
  LANG = LANG === "zh" ? "en" : "zh";
  try { localStorage.setItem("lang", LANG); } catch (e) {}
  applyLang();
  if (lastData) render(lastData);
  else if ($("#go").disabled) $("#out").innerHTML = loadingHtml(lastSymbol);
};

// Minimal markdown -> HTML for the report (headings, tables, bold, lists, SEC links).
// Each text piece goes through tr() first, so the Chinese view translates headings, cells and sentences.
function inline(s) {
  return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/\[([^\]]+)\]\((https:\/\/www\.sec\.gov\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function md(text) {
  const lines = text.split("\n"); let html = "", i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (l.startsWith("|")) {
      const rows = [];
      while (i < lines.length && lines[i].startsWith("|")) { rows.push(lines[i]); i++; }
      const cells = r => r.replace(/^\||\|$/g, "").split("|").map(c => tr(c.trim()));
      const head = cells(rows[0]), body = rows.slice(1).filter(r => !/^\|[\s|:-]+\|$/.test(r)).map(cells);
      // numbers, dates and ranges stay right-aligned; a column holding any other text is left-aligned
      const isNum = c => /^[\s\d.,%xKMBT+\-–\/:]*$/.test(c.replace(/n\/a/g, ""));
      const cls = head.map((_, j) => j && body.some(r => r[j] != null && !isNum(r[j])) ? ' class="l"' : "");
      html += "<table><thead><tr>" + head.map((c, j) => `<th${cls[j]}>${inline(c)}</th>`).join("") + "</tr></thead><tbody>";
      for (const r of body) html += "<tr>" + r.map((c, j) => `<td${cls[j] || ""}>${inline(c)}</td>`).join("") + "</tr>";
      html += "</tbody></table>"; continue;
    }
    if (l.startsWith("- ")) {
      html += "<ul>";
      while (i < lines.length && lines[i].startsWith("- ")) { html += `<li>${inline(tr(lines[i].slice(2)))}</li>`; i++; }
      html += "</ul>"; continue;
    }
    if (l.startsWith("## ")) html += `<h2>${inline(tr(l.slice(3)))}</h2>`;
    else if (l.startsWith("### ")) html += `<h3>${inline(tr(l.slice(4)))}</h3>`;
    else if (l.trim()) html += `<p>${inline(tr(l))}</p>`;
    i++;
  }
  return html;
}

// A stat tile: its label, the document's value (n/a when there is none) and a note under it: the period or unit
// of the value, or why there is none. A measure the document marks as not meaningful for this type of company
// (company.not_meaningful) shows n/a, even though the document still carries its value.
const tile = (label, [value, note]) => `<div class="stat"><div class="k">${esc(label)}</div>` +
  `<div class="v">${esc(value)}</div>${note ? `<div class="n">${esc(note)}</div>` : ""}</div>`;

function tiles(d) {
  const c = d.company || {}, now = d.valuation?.now || {}, fw = d.valuation?.forward || {}, m = d.models || {};
  const nm = new Set(c.not_meaningful || []), basis = d.periods?.valuation_basis || "";
  const kind = ["n/a", t("na_kind")];
  // today's multiples and yields use the valuation basis period (the TTM, else the latest fiscal year)
  const pe = nm.has("pe") ? kind : now.pe != null ? [mult(now.pe), basis]
    : ["n/a", now.earnings_yield != null && now.earnings_yield <= 0 ? t("na_loss") : ""];
  const ev = nm.has("ev_ebitda") ? kind : [mult(now.ev_ebitda), now.ev_ebitda != null ? basis : ""];
  const fcf = nm.has("fcf") ? kind : [pct(now.fcf_yield), now.fcf_yield != null ? basis : ""];
  const roic = last(d.metrics?.roic);
  const g = d.growth || {}, cagr = g.cagr?.revenue;
  const growth = cagr != null ? [pct(cagr), `${g.from}-${g.to}`] : ["n/a", g.years ? "" : t("na_short")];
  const pio = m.piotroski;
  // next-12-month EPS: the fiscal year in progress and the next one, weighted by the time left in the first
  const ntm = fw.ntm, w = ntm && ntm.weight != null && (ntm.fys || []).length === 2 ? Math.round(ntm.weight * 100) : null;
  const fpe = nm.has("pe") ? kind : !ntm ? ["n/a", t("na_no_est")] : fw.pe_ntm == null ? ["n/a", t("na_ntm_eps")]
    : [mult(fw.pe_ntm), w == null ? "" : `${w}% FY${ntm.fys[0]} + ${100 - w}% FY${ntm.fys[1]}`];
  const dcf = m.dcf || {}, vps = dcf.value_per_share;
  const dcfNote = { fcf_not_positive: t("na_dcf_fcf"), invalid_inputs: t("na_dcf_inputs"),
    skipped_financial: t("na_dcf_financial") }[dcf.status] || "";
  // the DCF value per share is in the statements' currency
  const dcfValue = nm.has("dcf") ? kind : vps == null ? ["n/a", dcfNote]
    : [perShare(vps), dcf.status === "value_not_positive" ? t("na_dcf_negative") : c.statement_currency];
  return tile(t("s_pe"), pe) + tile(t("s_ev"), ev) + tile(t("s_fcfy"), fcf) +
    tile(t("s_roic"), [pct(roic), roic != null ? last(d.statements?.period) : ""]) + tile(t("s_cagr"), growth) +
    tile(t("s_pio"), pio ? [`${pio.score} / ${pio.out_of}`, pio.fy] : ["n/a", t("na_short")]) +
    tile(t("s_fpe"), fpe) + tile(t("s_dcf"), dcfValue);
}

// Data not fetched from FMP's official API (a third-party proxy, or a document that does not say)
function routeNotice(dq) {
  const route = dq?.route;
  if (route && route.startsWith("official")) return "";
  return `<div class="notice">${route ? t("notice_proxy", esc(route.replace(/^third-party proxy at /, "")))
    : esc(t("notice_no_route"))}</div>`;
}

function headCard(d, head) {
  const c = d.company || {}, px = d.price || {};
  const sector = (LANG === "zh" ? sectorZh(c.sector) : c.sector) || "n/a";
  return `<div class="card"><div class="head"><div>
      <div class="name">${esc(c.name || d.ticker)} <span class="sub">${esc(d.ticker)}</span></div>
      <div class="sub">${esc(sector)} / ${esc(c.industry || "n/a")} · ${esc(c.exchange || "n/a")} ·
        ${esc(t("as_of"))} ${esc(d.as_of || "n/a")}</div></div>
      <div><div class="price">${perShare(px.value)} <span class="sub">${esc(px.currency)}</span></div>
      <div class="sub pmeta">${esc(t("mcap"))} ${money(c.market_cap)}</div>
      ${px.time ? `<div class="sub pmeta">${esc(t("px_time", px.time.slice(5)))}</div>` : ""}</div></div>
    <div class="stats">${tiles(d)}</div>${head.trim() ? `<div class="rhead">${md(head)}</div>` : ""}</div>`;
}

function render(data) {
  lastData = data;
  const d = data.result || {}, contract = d.contract;
  if (typeof contract !== "string" || !contract.startsWith("fa-2")) {
    $("#out").innerHTML = `<div class="card error">${esc(t("err_contract", contract == null ? "" : String(contract)))}</div>`;
    return;
  }
  const report = data.report || "", open = !!$("#out details")?.open;
  // the report's header block (the lines between its "# TICKER - Name" title and the first section), then one
  // tab per "## " section
  const parts = report.split(/\n(?=## )/);
  const head = parts[0].startsWith("## ") ? "" : parts.shift().split("\n").filter(l => !l.startsWith("# ")).join("\n");
  const sections = parts.filter(s => s.startsWith("## "));
  if (curTab >= sections.length) curTab = 0;
  let h = routeNotice(d.data_quality) + headCard(d, head);
  if (sections.length) {
    h += `<div class="tabs">` + sections.map((s, i) => `<button type="button" class="tab${i === curTab ? " on" : ""}" ` +
      `data-i="${i}">${esc(tr(s.split("\n")[0].slice(3)))}</button>`).join("") + `</div>`;
    h += sections.map((s, i) => `<div class="card section" data-i="${i}"${i === curTab ? "" : " hidden"}>${md(s)}</div>`)
      .join("");
  }
  h += report ? `<details${open ? " open" : ""}><summary>${esc(t("full_report"))}</summary>` +
    `<div class="card"><pre>${esc(report)}</pre></div></details>` : `<div class="card sub">${esc(t("no_report"))}</div>`;
  $("#out").innerHTML = h;
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => {
    curTab = +b.dataset.i;
    document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === b));
    document.querySelectorAll(".section").forEach(s => s.hidden = s.dataset.i !== b.dataset.i);
  });
}

const loadingHtml = sym => `<div class="card"><span class="spin"></span>${esc(t("loading", sym))}</div>`;

$("#f").onsubmit = async e => {
  e.preventDefault();
  const q = new URLSearchParams(new FormData(e.target));
  q.set("symbol", q.get("symbol").trim().toUpperCase());
  lastSymbol = q.get("symbol"); lastData = null; curTab = 0;
  $("#go").disabled = true;
  $("#out").innerHTML = loadingHtml(lastSymbol);
  try {
    const res = await fetch("/api/analyze?" + q);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
    render(data);
    history.replaceState(null, "", "?symbol=" + encodeURIComponent(q.get("symbol")));
  } catch (err) {
    $("#out").innerHTML = `<div class="card error">${esc(err.message)}</div>`;
  } finally { $("#go").disabled = false; }
};

applyLang();
const s0 = new URLSearchParams(location.search).get("symbol");
if (s0) { $("#symbol").value = s0; $("#f").requestSubmit(); }
</script>
</body>
</html>
